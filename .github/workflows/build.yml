name: build

on:
  push:
    branches: [desktop-juce]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (exe + VST3)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Standalone
        run: cmake --build build --config Release --target RhythmEngine_Standalone --parallel 4

      - name: Build VST3
        run: cmake --build build --config Release --target RhythmEngine_VST3 --parallel 4

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/RhythmEngine_artefacts/Release/Standalone/Prog Metronome.exe" dist/
          Copy-Item "build/RhythmEngine_artefacts/Release/VST3/Prog Metronome.vst3" dist/ -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: ProgMetronome-windows-x64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS (app + VST3 + AU)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
      HAS_ASC:  ${{ secrets.ASC_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Standalone
        run: cmake --build build --target RhythmEngine_Standalone --parallel 4

      - name: Build VST3
        run: cmake --build build --target RhythmEngine_VST3 --parallel 4

      - name: Build AU
        run: cmake --build build --target RhythmEngine_AU --parallel 4

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp -R "build/RhythmEngine_artefacts/Release/Standalone/Prog Metronome.app" dist/
          cp -R "build/RhythmEngine_artefacts/Release/VST3/Prog Metronome.vst3" dist/
          cp -R "build/RhythmEngine_artefacts/Release/AU/Prog Metronome.component" dist/

      # ── Signing + Notarization (only when secrets are present) ────────────────
      # Requires a "Developer ID Application" certificate (not iOS Distribution).
      # This is a separate cert you can create in your Apple Developer account
      # under Certificates → + → Developer ID Application.
      # Export it as .p12 and base64-encode it, same as the iOS cert.

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERTIFICATE_P12:      ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD:    ${{ github.run_id }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign app bundle and plugins
        if: env.HAS_CERT == 'true'
        run: |
          # Sign everything with hardened runtime — required for notarization
          codesign --deep --force --options runtime \
            --sign "Developer ID Application" \
            "dist/Prog Metronome.app"

          codesign --deep --force --options runtime \
            --sign "Developer ID Application" \
            "dist/Prog Metronome.vst3"

          codesign --deep --force --options runtime \
            --sign "Developer ID Application" \
            "dist/Prog Metronome.component"

          # Verify
          codesign --verify --verbose "dist/Prog Metronome.app"

      - name: Create DMG
        run: |
          # Pack everything into a DMG for distribution
          hdiutil create -volname "Prog Metronome" \
            -srcfolder dist \
            -ov -format UDZO \
            ProgMetronome-macos.dmg

      - name: Sign DMG
        if: env.HAS_CERT == 'true'
        run: |
          codesign --force --sign "Developer ID Application" \
            ProgMetronome-macos.dmg

      - name: Notarize DMG
        if: env.HAS_CERT == 'true' && env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8_BASE64: ${{ secrets.ASC_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_P8_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Submit for notarization and wait for result
          xcrun notarytool submit ProgMetronome-macos.dmg \
            --key ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --timeout 20m

          # Staple the notarization ticket to the DMG
          # so it passes Gatekeeper offline
          xcrun stapler staple ProgMetronome-macos.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ProgMetronome-macos-universal
          path: ProgMetronome-macos.dmg
          if-no-files-found: error

  linux:
    name: Linux (Standalone + VST3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Standalone
        run: cmake --build build --target RhythmEngine_Standalone --parallel 4

      - name: Build VST3
        run: cmake --build build --target RhythmEngine_VST3 --parallel 4

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp "build/RhythmEngine_artefacts/Release/Standalone/Prog Metronome" dist/
          cp -R "build/RhythmEngine_artefacts/Release/VST3/Prog Metronome.vst3" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ProgMetronome-linux-x64
          path: dist/
          if-no-files-found: error
